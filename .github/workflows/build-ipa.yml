name: Build unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 轻量自检：先确认仓库内容与 Actions 本身可用，再排进昂贵的 macOS 队列。
  preflight:
    name: Preflight (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository sanity check
        run: |
          set -euo pipefail
          echo "runner: $(uname -a)"
          test -f project.yml || { echo "::error::缺少 project.yml"; exit 1; }
          test -f Sources/Resources/Info.plist || { echo "::error::缺少 Info.plist"; exit 1; }
          echo "swift files: $(find Sources -name '*.swift' | wc -l)"
          echo "preflight ok"

  build:
    name: Build DaidaiPanel-iOS
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # 默认取 project.yml 里的 MARKETING_VERSION；打 tag（v1.2.3）时以 tag 为准。
          V=$(grep -oE 'MARKETING_VERSION: "[^"]+"' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "构建版本：${V}"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DaidaiPanel.xcodeproj \
            -scheme DaidaiPanel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a build.log | tail -n 200

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/DaidaiPanel.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::找不到构建产物 $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          IPA_NAME="DaidaiPanel-iOS-${VERSION}-unsigned.ipa"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          rm -rf Payload

          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "构建完成：${IPA_NAME}（$(du -h "$IPA_NAME" | cut -f1)）"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaidaiPanel-iOS-ipa
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.ipa_name }}
          draft: false
          generate_release_notes: true
