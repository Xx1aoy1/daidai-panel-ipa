name: Probe runners

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe-runners.yml' ]
  workflow_dispatch:

jobs:
  ubuntu:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu ok on $(uname -m)"

  macos-latest:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - run: sw_vers && xcodebuild -version

  macos-15:
    name: macos-15
    runs-on: macos-15
    steps:
      - run: sw_vers && xcodebuild -version

  macos-14:
    name: macos-14
    runs-on: macos-14
    steps:
      - run: sw_vers && xcodebuild -version
