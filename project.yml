name: DaidaiPanel
options:
  bundleIdPrefix: com.xiaoyi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES

targets:
  DaidaiPanel:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: DaidaiPanel
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyi.daidai.panel
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

schemes:
  DaidaiPanel:
    build:
      targets:
        DaidaiPanel: all
    run:
      config: Debug
    archive:
      config: Release
